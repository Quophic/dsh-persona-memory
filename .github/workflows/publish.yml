name: publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'Quophic/dsh-persona-memory'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        # npm 7+ auto-installs the non-optional @deepseek-ai/* peers, so the
        # smoke tests can resolve them on CI (the dsh runtime resolves them
        # from the host install instead; profiles set autoInstallPeers: false).
        run: npm install

      - name: Run smoke tests
        run: node test/smoke.mjs

      - name: Check version changed
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view dsh-persona-memory version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        if: steps.version.outputs.changed == 'true'
        run: |
          TAG="v${{ steps.version.outputs.local }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "tag $TAG already exists remotely — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
