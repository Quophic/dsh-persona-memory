name: publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'Quophic/dsh-persona-memory'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm install

      # The @deepseek-ai/* peers are optional-peer by design (the dsh runtime
      # resolves them from the host install; never duplicate them in the
      # plugin's dependencies). CI has no host dsh, so install them explicitly
      # --no-save just for the test step — package.json stays pristine.
      - name: Install host peers for tests
        run: npm install --no-save @deepseek-ai/dsh-tools@0.1.0-rc.6 @deepseek-ai/dsh-llm@0.1.0-rc.6 @deepseek-ai/dsh-home-paths@0.1.0-rc.6

      - name: Run smoke tests
        run: node test/smoke.mjs

      - name: Check version changed
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view dsh-persona-memory version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        if: steps.version.outputs.changed == 'true'
        run: |
          git tag "v${{ steps.version.outputs.local }}"
          git push origin "v${{ steps.version.outputs.local }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
